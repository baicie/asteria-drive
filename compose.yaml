name: asteria-drive-mvp

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: asteria
      POSTGRES_USER: asteria
      POSTGRES_PASSWORD: local-asteria-password
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteria -d asteria"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - asteria-postgres:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    command:
      - server
      - -dir=/data
      - -master.port=9333
      - -volume.port=8080
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "19333:9333"
      - "18888:8888"
      - "18333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://seaweedfs:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
    volumes:
      - asteria-seaweedfs:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  asteria-postgres:
  asteria-seaweedfs:

name: asteria-drive-local

x-app-environment: &app-environment
  ASTERIA_ENV: development
  ASTERIA_AUTH_MODE: trusted-dev
  ASTERIA_TRUSTED_TOKENS_JSON: '{"local-development-token-change-me-000000000000":{"tenant_id":"11111111-1111-4111-8111-111111111111","principal_id":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","tenant_name":"Local Asteria"}}'
  ASTERIA_CURSOR_HMAC_KEY: local-cursor-hmac-key-change-me-000000000000
  ASTERIA_METADATA_DRIVER: postgres
  ASTERIA_DATABASE_URL: postgres://asteria:local-asteria-password@postgres:5432/asteria?sslmode=disable
  ASTERIA_AUTO_MIGRATE: "false"
  ASTERIA_STORAGE_DRIVER: s3
  ASTERIA_S3_ENDPOINT: http://seaweedfs:8333
  ASTERIA_S3_PUBLIC_ENDPOINT: http://127.0.0.1:18333
  ASTERIA_S3_REGION: us-east-1
  ASTERIA_S3_BUCKET: asteria-drive-local
  ASTERIA_S3_ACCESS_KEY_ID: asteria-local-access
  ASTERIA_S3_SECRET_ACCESS_KEY: asteria-local-secret-not-for-production
  ASTERIA_S3_PATH_STYLE: "true"
  ASTERIA_S3_AUTO_CREATE_BUCKET: "true"
  ASTERIA_S3_CHECKSUM_HEADERS: "false"
  ASTERIA_MAINTENANCE_ENABLED: "false"

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: asteria
      POSTGRES_USER: asteria
      POSTGRES_PASSWORD: local-asteria-password
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteria -d asteria"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:3.85@sha256:49312939c00c01e5ee6afbd7d728b18027821d3764c35a797a72acd4fdf3296a
    command:
      - server
      - -dir=/data
      - -master.port=9333
      - -volume.port=8080
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:19333:9333"
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:18333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://seaweedfs:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    image: asteria-drive:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASTERIA_ENV: development
      ASTERIA_DATABASE_URL: postgres://asteria:local-asteria-password@postgres:5432/asteria?sslmode=disable
    entrypoint: ["/usr/local/bin/asteria-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: asteria-drive:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
      ASTERIA_SERVER_ADDRESS: 0.0.0.0:8080
      ASTERIA_METRICS_ADDRESS: 0.0.0.0:9090
      ASTERIA_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:19090:9090"
    healthcheck:
      test: ["CMD", "/usr/local/bin/asteria-server", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: asteria-drive-web:local
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  verifier:
    image: asteria-drive:local
    profiles: ["tools"]
    environment:
      <<: *app-environment
    entrypoint: ["/usr/local/bin/asteria-verify-storage"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: asteria-drive-local-postgres
  seaweedfs-data:
    name: asteria-drive-local-seaweedfs

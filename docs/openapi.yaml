  /api/v1/recycle-bin/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    delete:
      tags: [Recycle bin]
      operationId: purgeNode
      summary: Permanently purge a recycle-bin root
      description: |
        The operation first makes metadata non-visible and deletes only blobs
        selected by the repository's reference-safe purge plan.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The synchronous reference-safe purge completed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC/OAuth2 access token validated as a Resource Server. The token's
        issuer, signature, audience, expiry, and subject are verified; tenant
        and role come from PostgreSQL membership.
    trustedDevBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque trusted-development token
      description: |
        A high-entropy server-configured token mapped to exactly one tenant and
        principal. This mode is only for isolated development and acceptance.

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      description: Tenant-scoped resource UUID. Foreign-tenant IDs are returned as not found.
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: Number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque HMAC-protected cursor bound to tenant and listing scope.
      schema:
        type: string
        minLength: 1
    TenantSelector:
      name: X-Tenant-ID
      in: header
      required: false
      description: Required in OIDC mode; UUID of a tenant with an active membership. Ignored by trusted-dev.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted positive decimal node revision.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
    AuditAfterSequence:
      name: after_sequence
      in: query
      required: false
      description: Return events with a greater append-only sequence.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive UTC lower bound.
      schema:
        type: string
        format: date-time
    AuditUntil:
      name: until
      in: query
      required: false
      description: Exclusive UTC upper bound. A supplied range cannot exceed 31 days.
      schema:
        type: string
        format: date-time
    AuditFromRequired:
      name: from
      in: query
      required: true
      description: Inclusive UTC export lower bound.
      schema:
        type: string
        format: date-time
    AuditUntilRequired:
      name: until
      in: query
      required: true
      description: Exclusive UTC export upper bound, at most 31 days after from.
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opaque creation key scoped to the authenticated tenant, principal, and operation. It is retained only as a SHA-256 digest.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]+$'

  headers:
    RequestID:
      description: Validated incoming request ID or a server-generated request ID.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_.-]+$'
    ETag:
      description: Quoted decimal node revision used by If-Match.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"1"'
    IdempotencyReplayed:
      description: True when this response replays the resource created by an earlier matching request. Present whenever Idempotency-Key was supplied.
      schema:
        type: boolean

  responses:
    BadRequest:
      description: Request JSON, cursor, field value, or precondition syntax is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A valid bearer token is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The principal is authenticated but is not an active member or lacks the required role permission.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource is missing, belongs to another tenant, or is not visible in its current state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Name, state, restore target, or idempotency digest conflicts with the operation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RevisionMismatch:
      description: The current node revision differs from If-Match.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: JSON request body exceeds 1 MiB.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: A request with a JSON body must use application/json.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: A required metadata or object-storage dependency is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unclassified internal error.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: asteria-server
        status:
          const: ok
      example:
        service: asteria-server
        status: ok
    Ready:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: asteria-server
        status:
          const: ready
      example:
        service: asteria-server
        status: ready
    NotReady:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: asteria-server
        status:
          const: not_ready
      example:
        service: asteria-server
        status: not_ready

    Tenant:
      type: object
      additionalProperties: false
      required: [id, display_name, root_directory_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
        root_directory_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      example:
        id: 11111111-1111-4111-8111-111111111111
        display_name: Local Asteria
        root_directory_id: 7ce1b22b-dd38-4037-b337-f67f5ab84042
        created_at: "2026-08-02T10:00:00Z"
    TenantEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Tenant"

    NodeKind:
      type: string
      enum: [directory, file]
    Node:
      type: object
      additionalProperties: false
      required: [id, kind, name, revision, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          description: Omitted for the tenant root directory.
        kind:
          $ref: "#/components/schemas/NodeKind"
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: NFC-normalized display name.
        size:
          type: integer
          format: int64
          minimum: 1
          description: File size in bytes; omitted for directories.
        mime_type:
          type: string
          minLength: 1
          maxLength: 255
          description: Omitted for directories.
        revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 17da10b8-70d1-4f83-8d37-e127d110ef75
        parent_id: 7ce1b22b-dd38-4037-b337-f67f5ab84042
        kind: file
        name: report.bin
        size: 1048576
        mime_type: application/octet-stream
        revision: 1
        created_at: "2026-08-02T10:00:00Z"
        updated_at: "2026-08-02T10:00:00Z"
    NodeEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Node"

    UploadStatus:
      type: string
      enum:
        - created
        - uploading
        - completing
        - object_completed
        - committed
        - aborted
        - expired
        - failed
    Upload:
      type: object
      additionalProperties: false
      required:
        - id
        - parent_id
        - name
        - expected_size
        - mime_type
        - status
        - part_size
        - expires_at
        - committed_file_id
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        expected_size:
          type: integer
          format: int64
          minimum: 1
        mime_type:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: "#/components/schemas/UploadStatus"
        part_size:
          type: integer
          format: int64
          minimum: 5242880
          maximum: 5368709120
        expires_at:
          type: string
          format: date-time
        committed_file_id:
          type: [string, "null"]
          format: uuid

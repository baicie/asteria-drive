  /api/v1/nodes/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Governance]
      operationId: listNodeACL
      summary: List direct ACL grants for a node
      description: Requires tenant owner/admin or an inherited manager grant.
      responses:
        "200":
          description: Direct grants; inherited grants are evaluated but not duplicated in this list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Governance]
      operationId: setNodeACL
      summary: Create or update a principal or group grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetACLRequest"
      responses:
        "200":
          description: Effective direct grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":

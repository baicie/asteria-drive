  /api/v1/uploads:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Create an S3 multipart upload session
      description: Matching retries with the same Idempotency-Key replay the original upload session without creating another multipart upload. Reusing the key with a different request returns idempotency_conflict. The response never exposes the bucket, object key, or storage upload ID.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload session created.
          headers:
            Location:
              description: Relative URL of the upload session.
              schema:
                type: string
              example: /api/v1/uploads/55f5efc1-51e8-43be-9408-e4b6bcda92e0
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":

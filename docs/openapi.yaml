  /api/v1/uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Uploads]
      operationId: getUpload
      summary: Get an upload session
      responses:
        "200":
          description: Current upload session.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadEnvelope"
        "401":

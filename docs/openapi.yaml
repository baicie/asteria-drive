        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TenantSelector"
    delete:
      tags: [Governance]
      operationId: deleteNodeACL
      summary: Delete a direct ACL grant
      responses:
        "204":
          description: Grant deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":

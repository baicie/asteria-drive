openapi: 3.1.0
info:
  title: Asteria Drive MVP API
  version: 0.1.0-mvp
  summary: Control-plane API for the isolated Asteria Drive MVP
  description: |
    Asteria Drive coordinates tenant-scoped namespace operations, S3 multipart
    uploads, download authorizations, and recycle-bin operations. File bytes do
    not pass through this API.

    Business operations use either an OIDC/OAuth2 Bearer JWT (production) or a
    server-configured trusted-development bearer token (isolated development).
    OIDC requests select an active tenant with X-Tenant-ID; tenant membership
    and role are read from PostgreSQL rather than trusted from JWT claims.
servers:
  - url: http://127.0.0.1:8080
    description: Isolated local development
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security:
  - oidcBearer: []
  - trustedDevBearer: []
tags:
  - name: Probes
    description: Unauthenticated process and dependency health checks.
  - name: Tenant
    description: Discovery of the tenant fixed by the authenticated token.
  - name: Governance
    description: Invitations, membership, groups, and inherited node ACLs.
  - name: Audit
    description: Append-only tenant security event pages and bounded NDJSON export.
  - name: Namespace
    description: Tenant-scoped file and directory metadata operations.
  - name: Uploads
    description: S3 multipart upload coordination without file-byte proxying.
  - name: Downloads
    description: Short-lived direct-download authorization.
  - name: Recycle bin
    description: Logical deletion, strict restore, and reference-safe purge.

paths:
  /healthz:
    get:
      tags: [Probes]
      operationId: getHealth
      summary: Check process liveness
      description: Does not call PostgreSQL or object storage.
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /readyz:
    get:
      tags: [Probes]
      operationId: getReadiness
      summary: Check required dependencies
      security: []
      responses:
        "200":
          description: Metadata and object-storage dependencies are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: At least one required dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReady"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/invitations/accept:
    post:
      tags: [Governance]
      operationId: acceptTenantInvitation
      summary: Accept an invitation as a verified external identity
      description: The bearer token is verified without requiring an existing tenant membership. Its issuer and subject must exactly match the invitation. The invitation token is supplied only in the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted and membership created, or the original accepted result replayed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/tenant:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Tenant]
      operationId: getCurrentTenant
      summary: Get the authenticated tenant and root directory
      description: |
        In trusted-dev the tenant is fixed by the bearer-token mapping. In OIDC
        mode the request must include X-Tenant-ID for an active membership.
      responses:
        "200":
          description: Current tenant.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/tenant/members:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Tenant]
      operationId: listTenantMembers
      summary: List tenant members
      description: Lists active and suspended members for owner/admin principals.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Stable keyset page ordered by principal ID.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/tenant/members/{principal_id}:
    parameters:
      - name: principal_id
        in: path
        required: true
        description: Tenant-scoped principal UUID.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TenantSelector"
    patch:
      tags: [Tenant]
      operationId: updateTenantMember
      summary: Change a tenant member role or status
      description: Owners may update any member. Admins cannot modify owners or grant the owner role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Updated member.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    delete:
      tags: [Tenant]
      operationId: deleteTenantMember
      summary: Delete a tenant membership
      responses:
        "204":
          description: Membership deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/tenant/invitations:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Governance]
      operationId: listTenantInvitations
      summary: List tenant invitations
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InvitationStatus"
      responses:
        "200":
          description: Tenant invitations.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    post:
      tags: [Governance]
      operationId: createTenantInvitation
      summary: Create a tenant invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created; token is returned only by this response.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/tenant/invitations/{invitation_id}/revoke:
    parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TenantSelector"
    post:
      tags: [Governance]
      operationId: revokeTenantInvitation
      summary: Revoke a pending tenant invitation
      responses:
        "200":
          description: Invitation revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/tenant/groups:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Governance]
      operationId: listTenantGroups
      summary: List tenant groups
      responses:
        "200":
          description: Groups ordered by normalized name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Governance]
      operationId: createTenantGroup
      summary: Create a tenant group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMutationRequest"
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tenant/groups/{group_id}:
    parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TenantSelector"
    patch:
      tags: [Governance]
      operationId: updateTenantGroup
      summary: Rename a tenant group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMutationRequest"
      responses:
        "200":
          description: Updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Governance]
      operationId: deleteTenantGroup
      summary: Delete a tenant group and its memberships and ACL grants
      responses:
        "204":
          description: Group deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tenant/groups/{group_id}/members:
    parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Governance]
      operationId: listTenantGroupMembers
      summary: List group members
      responses:
        "200":
          description: Group members ordered by principal ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tenant/groups/{group_id}/members/{principal_id}:
    parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: principal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/TenantSelector"
    put:
      tags: [Governance]
      operationId: addTenantGroupMember
      summary: Idempotently add a tenant member to a group
      responses:
        "204":
          description: Group membership exists.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Governance]
      operationId: removeTenantGroupMember
      summary: Idempotently remove a member from a group
      responses:
        "204":
          description: Group membership is absent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tenant/audit-events:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Audit]
      operationId: listTenantAuditEvents
      summary: Page append-only tenant audit events
      parameters:
        - $ref: "#/components/parameters/AuditAfterSequence"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditUntil"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Audit events ordered by sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/tenant/audit-events/export:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Audit]
      operationId: exportTenantAuditEvents
      summary: Export a bounded UTC range as NDJSON
      parameters:
        - $ref: "#/components/parameters/AuditFromRequired"
        - $ref: "#/components/parameters/AuditUntilRequired"
      responses:
        "200":
          description: At most 10,000 audit events as one JSON object per line.
          content:
            application/x-ndjson:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/directories:
    parameters:
      - $ref: "#/components/parameters/TenantSelector"
    post:
      tags: [Namespace]
      operationId: createDirectory
      summary: Create a directory
      description: Matching retries with the same Idempotency-Key replay the original directory. Reusing the key with a different request returns idempotency_conflict.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectoryRequest"
      responses:
        "201":
          description: Directory created.
          headers:
            Location:
              description: Relative URL of the created directory.
              schema:
                type: string
              example: /api/v1/directories/17da10b8-70d1-4f83-8d37-e127d110ef75
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/directories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Namespace]
      operationId: getDirectory
      summary: Get an active directory
      responses:
        "200":
          description: Directory metadata.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/directories/{id}/children:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Namespace]
      operationId: listDirectoryChildren
      summary: List direct active children
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Stable keyset page ordered by normalized name and ID.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/files/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    get:
      tags: [Namespace]
      operationId: getFile
      summary: Get an active committed file
      responses:
        "200":
          description: File metadata.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /api/v1/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
      - $ref: "#/components/parameters/TenantSelector"
    patch:
      tags: [Namespace]
      operationId: updateNode
      summary: Rename or move a file or directory
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: Updated node.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/RevisionMismatch"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    delete:
      tags: [Recycle bin]
      operationId: recycleNode
      summary: Move a file or directory tree to the recycle bin
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Node was moved to the recycle bin.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
        "400":

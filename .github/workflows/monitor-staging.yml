name: Monitor staging

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: asteria-drive-staging
  cancel-in-progress: false

env:
  MONITOR_SCRIPT_SHA256: 3ef39670c2a5a90b9aee4bf926c7dd6b40938038d861457b0ed92ba48765c279

jobs:
  monitor:
    name: Monitor / staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Prepare strict SSH transport
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.ASTERIA_STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ASTERIA_STAGING_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.ASTERIA_STAGING_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.ASTERIA_STAGING_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.ASTERIA_STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          for value in DEPLOY_KEY KNOWN_HOSTS DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            [[ -n "${!value:-}" ]] || { printf '%s is empty\n' "$value" >&2; exit 1; }
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { printf 'deploy host is invalid\n' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { printf 'deploy user is invalid\n' >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ && "$DEPLOY_PORT" -ge 1 && "$DEPLOY_PORT" -le 65535 ]] || {
            printf 'deploy port is invalid\n' >&2
            exit 1
          }
          install -d -m 0700 "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/staging-monitor-evidence"
          printf '%s\n' "$DEPLOY_KEY" >"$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          host_lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then
            host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$host_lookup" -f "$RUNNER_TEMP/ssh/known_hosts" |
            grep -Eq 'ssh-ed25519[[:space:]]' || { printf 'approved ED25519 host key is missing\n' >&2; exit 1; }
          printf 'DEPLOY_HOST=%s\n' "$DEPLOY_HOST" >>"$GITHUB_ENV"
          printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT" >>"$GITHUB_ENV"
          printf 'DEPLOY_USER=%s\n' "$DEPLOY_USER" >>"$GITHUB_ENV"

      - name: Probe capacity and health
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence_dir="$RUNNER_TEMP/staging-monitor-evidence"
          raw_evidence="$RUNNER_TEMP/staging-monitor.raw.json"
          raw_stderr="$RUNNER_TEMP/staging-monitor.remote-stderr.log"
          evidence="$evidence_dir/monitor-evidence.json"
          collection_status="$evidence_dir/collection-status.json"
          trap 'rm -f -- "$raw_evidence" "$raw_stderr"' EXIT
          set +e
          ssh \
            -F none -i "$RUNNER_TEMP/ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o GlobalKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -o ProxyCommand=none -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "status $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $GITHUB_SHA $MONITOR_SCRIPT_SHA256" \
            >"$raw_evidence" 2>"$raw_stderr"
          probe_exit="$?"
          set -e
          RAW_EVIDENCE="$raw_evidence" RAW_STDERR="$raw_stderr" PROBE_EXIT="$probe_exit" \
            python3 - "$collection_status" <<'PY'
          import hashlib
          import json
          import os
          import sys

          def describe(path):
              if not os.path.isfile(path):
                  return {"present": False, "size_bytes": 0, "sha256": None}
              digest = hashlib.sha256()
              size = 0
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(65536), b""):
                      size += len(chunk)
                      digest.update(chunk)
              return {"present": True, "size_bytes": size, "sha256": digest.hexdigest()}

          status = {
              "schema": "asteria-drive-staging-monitor-collection/v1",
              "probe_exit": int(os.environ["PROBE_EXIT"]),
              "raw_evidence": describe(os.environ["RAW_EVIDENCE"]),
              "remote_stderr": describe(os.environ["RAW_STDERR"]),
          }
          with open(sys.argv[1], "x", encoding="utf-8") as handle:
              json.dump(status, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          PROBE_EXIT="$probe_exit" python3 - "$raw_evidence" "$evidence" <<'PY'
          import json
          import math
          import os
          import re
          import sys
          from datetime import datetime, timedelta, timezone

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate evidence key")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number is forbidden: {value}")

          if not os.path.isfile(sys.argv[1]) or os.path.getsize(sys.argv[1]) == 0:
              raise SystemExit("remote staging monitor produced no evidence")
          if os.path.getsize(sys.argv[1]) > 64 * 1024:
              raise SystemExit("remote staging monitor evidence exceeds the size limit")
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(
                  handle, object_pairs_hook=reject_duplicates, parse_constant=reject_constant
              )

          expected_keys = {
              "schema", "status", "last_phase", "started_at", "completed_at",
              "github_run_id", "github_run_attempt", "workflow_sha", "compose_sha256",
              "expected_image", "claim_boundary", "load1", "memory_used_percent",
              "root_filesystem", "disk_used_percent", "disk_available_bytes",
              "docker_filesystem", "docker_disk_used_percent", "docker_disk_available_bytes",
              "postgres_data_filesystem", "postgres_data_disk_used_percent",
              "postgres_data_disk_available_bytes", "seaweedfs_data_filesystem",
              "seaweedfs_data_disk_used_percent", "seaweedfs_data_disk_available_bytes",
              "docker_data_root_on_root_filesystem", "compose_verified", "api_container_verified",
              "postgres_container_verified", "seaweedfs_container_verified", "health_succeeded",
              "readiness_succeeded", "metrics_scrape_succeeded", "loopback_bindings_verified",
              "capacity_guard_verified", "data_volume_filesystems_verified", "postgres_tls_verified",
              "postgres_tls_dsn_verified", "postgres_hba_verified", "monitor_script_sha256",
              "postgres_plaintext_rejected", "postgres_plaintext_stderr_present",
              "postgres_plaintext_stderr_sha256", "postgres_scram_password_verified",
              "postgres_tls_connections", "postgres_tls_version", "postgres_tls_cipher",
              "postgres_tls_bits", "postgres_tls_ca_sha256", "postgres_tls_leaf_sha256",
              "postgres_tls_leaf_san", "postgres_tls_leaf_not_after",
              "capacity_max_disk_used_percent", "capacity_min_disk_available_bytes",
          }
          if set(report) != expected_keys:
              missing = sorted(expected_keys - set(report))
              extra = sorted(set(report) - expected_keys)
              raise SystemExit(
                  f"monitor evidence fields mismatch (missing_count={len(missing)}, extra_count={len(extra)})"
              )

          expected_identity = {
              "schema": "asteria-drive-staging-monitor/v2",
              "status": "success",
              "last_phase": "complete",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "monitor_script_sha256": os.environ["MONITOR_SCRIPT_SHA256"],
              "compose_sha256": "aa4336dc8914faaccc304266cba715b8212d10722adb4afd7aeea5d40f4c9637",
              "expected_image": "sha256:2b73f8a7a271c0d7d6c7f73e15987b5e29290437146f07a57b57b9aef031d842",
              "claim_boundary": "staging-not-production",
              "capacity_max_disk_used_percent": 85,
              "capacity_min_disk_available_bytes": 5 * 1024 * 1024 * 1024,
          }
          for key, expected in expected_identity.items():
              if report.get(key) != expected:
                  raise SystemExit(f"monitor evidence has unexpected {key}")

          if int(os.environ["PROBE_EXIT"]) != 0:
              raise SystemExit("remote staging monitor failed")
          for key in (
              "compose_verified",
              "api_container_verified",
              "postgres_container_verified",
              "seaweedfs_container_verified",
              "health_succeeded",
              "readiness_succeeded",
              "metrics_scrape_succeeded",
              "loopback_bindings_verified",
              "capacity_guard_verified",
              "data_volume_filesystems_verified",
              "postgres_tls_verified",
              "postgres_tls_dsn_verified",
              "postgres_hba_verified",
              "postgres_plaintext_rejected",
              "postgres_plaintext_stderr_present",
              "postgres_scram_password_verified",
          ):
              if report.get(key) is not True:
                  raise SystemExit(f"monitor evidence did not prove {key}")

          if type(report.get("postgres_tls_connections")) is not int or report["postgres_tls_connections"] < 1:
              raise SystemExit("monitor evidence has no PostgreSQL TLS application connection")
          if report.get("postgres_tls_version") not in {"TLSv1.2", "TLSv1.3"}:
              raise SystemExit("monitor evidence has an unexpected PostgreSQL TLS version")
          cipher = report.get("postgres_tls_cipher")
          if not isinstance(cipher, str) or not re.fullmatch(r"[A-Za-z0-9_-]+", cipher):
              raise SystemExit("monitor evidence has an invalid PostgreSQL TLS cipher")
          if type(report.get("postgres_tls_bits")) is not int or report["postgres_tls_bits"] < 128:
              raise SystemExit("monitor evidence has weak PostgreSQL TLS cipher bits")
          for key in ("postgres_tls_ca_sha256", "postgres_tls_leaf_sha256", "postgres_plaintext_stderr_sha256"):
              if not isinstance(report.get(key), str) or not re.fullmatch(r"[0-9a-f]{64}", report[key]):
                  raise SystemExit(f"monitor evidence has an invalid {key}")
          if report.get("postgres_tls_leaf_san") != "DNS:postgres":
              raise SystemExit("monitor evidence has an unexpected PostgreSQL certificate SAN")
          try:
              not_after = datetime.fromisoformat(report["postgres_tls_leaf_not_after"].replace("Z", "+00:00"))
          except (KeyError, AttributeError, ValueError) as error:
              raise SystemExit("monitor evidence has an invalid PostgreSQL certificate expiry") from error
          if not_after < datetime.now(timezone.utc) + timedelta(days=30):
              raise SystemExit("PostgreSQL certificate expires in under 30 days")

          for prefix in ("", "docker_", "postgres_data_", "seaweedfs_data_"):
              used = report.get(f"{prefix}disk_used_percent")
              available = report.get(f"{prefix}disk_available_bytes")
              if type(used) is not int or used < 0 or used > 85:
                  raise SystemExit(f"monitor evidence exceeded the {prefix}disk usage limit")
              if type(available) is not int or available < 5 * 1024 * 1024 * 1024:
                  raise SystemExit(f"monitor evidence missed the {prefix}free-space reserve")

          root_filesystem = report.get("root_filesystem")
          docker_filesystem = report.get("docker_filesystem")
          if not isinstance(root_filesystem, str) or not root_filesystem or root_filesystem == "unknown":
              raise SystemExit("monitor evidence has no root filesystem identity")
          if not isinstance(docker_filesystem, str) or not docker_filesystem or docker_filesystem == "unknown":
              raise SystemExit("monitor evidence has no Docker filesystem identity")
          for key in ("postgres_data_filesystem", "seaweedfs_data_filesystem"):
              if report.get(key) != docker_filesystem:
                  raise SystemExit(f"monitor evidence has unexpected {key}")
          if type(report.get("docker_data_root_on_root_filesystem")) is not bool:
              raise SystemExit("monitor evidence has invalid Docker/root filesystem relationship")
          filesystem_pattern = re.compile(r"[A-Za-z0-9_./:+-]{1,255}")
          for key in ("root_filesystem", "docker_filesystem", "postgres_data_filesystem", "seaweedfs_data_filesystem"):
              if not isinstance(report.get(key), str) or not filesystem_pattern.fullmatch(report[key]):
                  raise SystemExit(f"monitor evidence has invalid {key}")
          for key in ("load1", "memory_used_percent"):
              value = report.get(key)
              if (
                  isinstance(value, bool)
                  or not isinstance(value, (int, float))
                  or not math.isfinite(value)
                  or value < 0
              ):
                  raise SystemExit(f"monitor evidence has invalid {key}")
          if report["memory_used_percent"] > 100:
              raise SystemExit("monitor evidence has invalid memory usage")
          for key in ("started_at", "completed_at"):
              if not isinstance(report.get(key), str) or not re.fullmatch(
                  r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", report[key]
              ):
                  raise SystemExit(f"monitor evidence has invalid {key}")
          temporary = sys.argv[2] + ".tmp"
          with open(temporary, "x", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          os.chmod(temporary, 0o600)
          os.replace(temporary, sys.argv[2])
          PY
          rm -f -- "$raw_evidence" "$raw_stderr"
          trap - EXIT

      - name: Upload monitor evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-monitor-evidence
          path: ${{ runner.temp }}/staging-monitor-evidence
          if-no-files-found: error
          retention-days: 30

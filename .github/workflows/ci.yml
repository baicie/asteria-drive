name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GO_MIN_VERSION: 1.26.10
  GO_CURRENT_VERSION: 1.27.3
  NODE_VERSION: 24.16.0
  MIN_TOTAL_COVERAGE: "39.0"

jobs:
  quality:
    name: CI / quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_MIN_VERSION }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          go test -json -coverprofile=coverage.out -count=1 ./... | tee unit-test.json
      - name: Enforce coverage floor
        shell: bash
        run: |
          set -euo pipefail
          total_coverage="$(go tool cover -func=coverage.out | awk '$1 == "total:" {gsub(/%/, "", $3); print $3}')"
          if [[ -z "$total_coverage" ]]; then
            printf 'Could not read total coverage from coverage.out\n' >&2
            exit 1
          fi
          awk -v actual="$total_coverage" -v minimum="$MIN_TOTAL_COVERAGE" 'BEGIN {
            if (actual + 0 < minimum + 0) {
              printf "Total coverage %.1f%% is below the %.1f%% floor\n", actual, minimum > "/dev/stderr"
              exit 1
            }
          }'
          printf 'Total coverage %s%% meets the %s%% floor\n' "$total_coverage" "$MIN_TOTAL_COVERAGE"
      - name: Run vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Exercise release packaging
        shell: bash
        run: |
          set -euo pipefail
          release_output="$(mktemp -d "$RUNNER_TEMP/asteria-release-dry-run.XXXXXXXX")"
          trap 'rm -rf "$release_output"' EXIT
          release_commit="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct HEAD)"
          go run ./tools/package-release \
            -version v0.0.0-ci \
            -commit "$release_commit" \
            -source-date-epoch "$source_epoch" \
            -output "$release_output"
          go run ./tools/release-checksums -dir "$release_output"
          (cd "$release_output" && sha256sum --check checksums.txt)
          test -s "$release_output/asteria-drive_0.0.0-ci_linux_amd64.tar.gz"
          test -s "$release_output/asteria-drive_0.0.0-ci_linux_arm64.tar.gz"
          test -s "$release_output/release-manifest.json"
      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
              ;;
            push)
              git diff --check "${{ github.event.before }}...${{ github.sha }}"
              ;;
            *)
              git diff --check HEAD^ HEAD
              ;;
          esac
      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence
          path: |
            coverage.out
            unit-test.json
          if-no-files-found: ignore
          retention-days: 7

  race:
    name: CI / race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
      - name: Run race detector
        run: go test -race ./... -count=1

  integration:
    name: CI / integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: asteria-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ASTERIA_TEST_DATABASE_URL: postgres://asteria:local-asteria-password@127.0.0.1:15432/asteria?sslmode=disable
      ASTERIA_TEST_S3_ENDPOINT: http://127.0.0.1:18333
      ASTERIA_TEST_S3_ACCESS_KEY: asteria-local-access
      ASTERIA_TEST_S3_SECRET_KEY: asteria-local-secret-not-for-production
      ASTERIA_TEST_S3_REGION: us-east-1
      ASTERIA_TEST_S3_BUCKET: asteria-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
      - name: Validate integration environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ASTERIA_TEST_DATABASE_URL
            ASTERIA_TEST_S3_ENDPOINT
            ASTERIA_TEST_S3_ACCESS_KEY
            ASTERIA_TEST_S3_SECRET_KEY
            ASTERIA_TEST_S3_REGION
            ASTERIA_TEST_S3_BUCKET
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              printf 'Required integration variable %s is missing\n' "$variable" >&2
              exit 1
            fi
          done
          docker compose config --quiet
      - name: Start isolated dependencies
        run: docker compose up -d --wait --wait-timeout 180
      - name: Show dependency status
        run: docker compose ps
      - name: Run required integration tests
        shell: bash
        run: |
          set -euo pipefail
          go test -json -p=1 -count=1 -timeout=15m \
            -coverprofile=integration-coverage.out \
            ./internal/postgres ./internal/s3store ./internal/server \
            > integration-test.raw.json
          go run ./tools/verify-integration-report \
            -manifest .github/integration-tests.json \
            -input integration-test.raw.json
      - name: Sanitize integration evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f integration-test.raw.json' EXIT
          if [[ -f integration-test.raw.json ]]; then
            go run ./tools/sanitize-ci-log \
              < integration-test.raw.json \
              > integration-test.json
          fi
          (docker compose logs --no-color 2>&1 || true) \
            | go run ./tools/sanitize-ci-log \
            > compose.log
      - name: Remove isolated dependencies
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans
      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-evidence
          path: |
            integration-test.json
            integration-coverage.out
            compose.log
          if-no-files-found: ignore
          retention-days: 7

  api-contract:
    name: CI / api-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_MIN_VERSION }}
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install contract tools
        run: npm ci --ignore-scripts
      - name: Validate CI workflow schema
        run: npm run lint:actions
      - name: Lint OpenAPI
        run: npm run lint:openapi
      - name: Compare OpenAPI with base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:docs/openapi.yaml" > "$RUNNER_TEMP/base-openapi.yaml"
          go run ./tools/verify-openapi-compat \
            -base "$RUNNER_TEMP/base-openapi.yaml" \
            -current docs/openapi.yaml
          changed="$(git diff --name-only "$BASE_SHA...$GITHUB_SHA")"
          if grep -qx 'docs/openapi.yaml' <<<"$changed" && ! grep -q '^docs/adr/' <<<"$changed"; then
            printf 'OpenAPI changes require an accompanying ADR\n' >&2
            exit 1
          fi
      - name: Compare documented and registered routes
        run: go test ./internal/server -run '^TestOpenAPIOperationsMatchRegisteredRoutes$' -count=1

  web:
    name: CI / web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck web console
        run: npm run typecheck
      - name: Run web unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit -- --reporter=default --reporter=junit --outputFile.junit=unit-results.xml --coverage 2>&1 | tee unit-output.log
      - name: Build web console
        run: npm run build
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps chromium
      - name: Run web browser tests
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report
        run: npm run test:e2e
      - name: Upload web failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-evidence
          path: |
            web/unit-results.xml
            web/unit-output.log
            web/coverage
            web/playwright-report
            web/playwright-results.xml
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  web-live:
    name: CI / web-live
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: asteria-web-live-${{ github.run_id }}-${{ github.run_attempt }}
      ASTERIA_TEST_DATABASE_URL: postgres://asteria:local-asteria-password@127.0.0.1:15432/asteria?sslmode=disable
      ASTERIA_TEST_S3_ENDPOINT: http://127.0.0.1:18333
      ASTERIA_TEST_S3_ACCESS_KEY: asteria-local-access
      ASTERIA_TEST_S3_SECRET_KEY: asteria-local-secret-not-for-production
      ASTERIA_TEST_S3_REGION: us-east-1
      ASTERIA_TEST_S3_BUCKET: asteria-web-live-${{ github.run_id }}-${{ github.run_attempt }}
      # 40 characters: parseTokens refuses anything under 32 bytes as low entropy.
      ASTERIA_E2E_TOKEN: e2e-live-token-not-for-production-0000000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start isolated dependencies
        run: docker compose up -d --wait --wait-timeout 180
      - name: Build control plane
        run: |
          go build -o "$RUNNER_TEMP/asteria-server" ./cmd/asteria-server
          go build -o "$RUNNER_TEMP/asteria-migrate" ./cmd/asteria-migrate
      - name: Migrate database
        run: "$RUNNER_TEMP/asteria-migrate"
        env:
          ASTERIA_DATABASE_URL: ${{ env.ASTERIA_TEST_DATABASE_URL }}
      - name: Launch control plane
        shell: bash
        env:
          ASTERIA_ENV: development
          ASTERIA_DATABASE_URL: ${{ env.ASTERIA_TEST_DATABASE_URL }}
          ASTERIA_METADATA_DRIVER: postgres
          ASTERIA_STORAGE_DRIVER: s3
          ASTERIA_S3_ENDPOINT: ${{ env.ASTERIA_TEST_S3_ENDPOINT }}
          ASTERIA_S3_PUBLIC_ENDPOINT: ${{ env.ASTERIA_TEST_S3_ENDPOINT }}
          ASTERIA_S3_ACCESS_KEY_ID: ${{ env.ASTERIA_TEST_S3_ACCESS_KEY }}
          ASTERIA_S3_SECRET_ACCESS_KEY: ${{ env.ASTERIA_TEST_S3_SECRET_KEY }}
          ASTERIA_S3_REGION: ${{ env.ASTERIA_TEST_S3_REGION }}
          ASTERIA_S3_BUCKET: ${{ env.ASTERIA_TEST_S3_BUCKET }}
          ASTERIA_S3_AUTO_CREATE_BUCKET: "true"
          # Required for ADR-0028: without it a signed part checksum is not enforced.
          ASTERIA_S3_CHECKSUM_HEADERS: "true"
          ASTERIA_AUTH_MODE: trusted-dev
          # parseTokens reads an object keyed by the bearer secret itself.
          ASTERIA_TRUSTED_TOKENS_JSON: '{"e2e-live-token-not-for-production-0000000":{"tenant_id":"11111111-1111-4111-8111-111111111111","principal_id":"22222222-2222-4222-8222-222222222222","tenant_name":"Live E2E"}}'
          ASTERIA_CURSOR_HMAC_KEY: not-for-production-cursor-key-0000000000
          ASTERIA_SERVER_ADDRESS: 127.0.0.1:18091
          ASTERIA_METRICS_ADDRESS: 127.0.0.1:19090
          ASTERIA_MAINTENANCE_ENABLED: "false"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asteria-server" > "$RUNNER_TEMP/asteria-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/asteria-server.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18091/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/asteria-server.log" >&2
          echo "control plane did not become healthy" >&2
          exit 1
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build web console against the live API
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: web
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: npx playwright install --with-deps chromium
      - name: Run live browser upload and download
        working-directory: web
        env:
          ASTERIA_E2E_API: http://127.0.0.1:18091
          PLAYWRIGHT_HTML_REPORT: playwright-report-live
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-results-live.xml
        run: npm run test:e2e -- --grep "live stack"
      - name: Sanitize web-live evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          (docker compose logs --no-color 2>&1 || true) \
            | go run ./tools/sanitize-ci-log \
            > web-live-compose.log
          if [[ -f "$RUNNER_TEMP/asteria-server.log" ]]; then
            go run ./tools/sanitize-ci-log < "$RUNNER_TEMP/asteria-server.log" > web-live-server.log
          fi
      - name: Remove isolated dependencies
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/asteria-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/asteria-server.pid")" 2>/dev/null || true
          fi
          docker compose down -v --remove-orphans
        shell: bash
      - name: Upload web-live failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-live-evidence
          path: |
            web/playwright-report-live
            web/playwright-results-live.xml
            web/test-results
            web-live-compose.log
            web-live-server.log
          if-no-files-found: ignore
          retention-days: 7

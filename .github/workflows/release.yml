name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag to package and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GO_VERSION: 1.26.6
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Release / build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release-input.outputs.tag }}
      version: ${{ steps.release-input.outputs.version }}
      commit: ${{ steps.release-input.outputs.commit }}
      build_time: ${{ steps.release-input.outputs.build_time }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Validate release input
        id: release-input
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Release tag has an invalid format: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            printf 'Checked out commit %s does not match tag %s commit %s\n' "$head_commit" "$RELEASE_TAG" "$tag_commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            printf 'Release tag %s is not reachable from protected main\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          source_epoch="$(git show -s --format=%ct "$tag_commit")"
          build_time="$(date -u -d "@$source_epoch" +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'epoch=%s\n' "$source_epoch" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"
      - name: Build deterministic release artifacts
        env:
          RELEASE_TAG: ${{ steps.release-input.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release-input.outputs.commit }}
          RELEASE_EPOCH: ${{ steps.release-input.outputs.epoch }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/asteria-release"
          go run ./tools/package-release \
            -version "$RELEASE_TAG" \
            -commit "$RELEASE_COMMIT" \
            -source-date-epoch "$RELEASE_EPOCH" \
            -output "$RUNNER_TEMP/asteria-release"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/asteria-release
          format: spdx-json
          output-file: ${{ runner.temp }}/asteria-release/asteria-drive_${{ steps.release-input.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Write release checksums
        run: go run ./tools/release-checksums -dir "$RUNNER_TEMP/asteria-release"
      - name: Upload release bundle for publish gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.release-input.outputs.tag }}
          path: ${{ runner.temp }}/asteria-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release / publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Check out resolved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity remains unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$RELEASE_COMMIT" ]]; then
            printf 'Publish checkout %s does not match resolved release commit %s\n' "$head_commit" "$RELEASE_COMMIT" >&2
            exit 1
          fi

          remote_tags="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          remote_tag_commit="$(printf '%s\n' "$remote_tags" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
          if [[ -z "$remote_tag_commit" ]]; then
            remote_tag_commit="$(printf '%s\n' "$remote_tags" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -z "$remote_tag_commit" || "$remote_tag_commit" != "$RELEASE_COMMIT" ]]; then
            printf 'Remote tag %s no longer resolves to release commit %s\n' "$RELEASE_TAG" "$RELEASE_COMMIT" >&2
            exit 1
          fi

          published_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq "$RELEASE_TAG" <<< "$published_tags"; then
            printf 'GitHub Release %s already exists; refusing to republish it\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          immutable_error="$(mktemp)"
          if immutable_releases="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled' 2>"$immutable_error")"; then
            if [[ "$immutable_releases" != 'true' ]]; then
              printf 'GitHub immutable releases must be enabled before publishing %s\n' "$RELEASE_TAG" >&2
              rm -f "$immutable_error"
              exit 1
            fi
          elif grep -Fq 'Resource not accessible by integration' "$immutable_error"; then
            printf 'Actions GITHUB_TOKEN cannot read the immutable-releases administration endpoint; post-publish isImmutable verification remains mandatory\n'
          else
            cat "$immutable_error" >&2
            rm -f "$immutable_error"
            printf 'Could not verify GitHub immutable releases before publishing %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          rm -f "$immutable_error"
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}/asteria-release
      - name: Verify release checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asteria-release"
          sha256sum --check checksums.txt
          manifest_format="$(jq -er '.format' release-manifest.json)"
          manifest_version="$(jq -er '.version' release-manifest.json)"
          manifest_commit="$(jq -er '.commit' release-manifest.json)"
          if [[ "$manifest_format" != 'asteria-drive-release/v1' ||
                "$manifest_version" != "$RELEASE_TAG" ||
                "$manifest_commit" != "$RELEASE_COMMIT" ]]; then
            printf 'Release manifest identity does not match the resolved tag and commit\n' >&2
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite OCI release tags
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          for image_ref in \
            "$REGISTRY/$IMAGE_NAME:$RELEASE_TAG" \
            "$REGISTRY/$IMAGE_NAME:sha-$RELEASE_COMMIT"; do
            inspect_error="$(mktemp)"
            if docker buildx imagetools inspect "$image_ref" >/dev/null 2>"$inspect_error"; then
              rm -f "$inspect_error"
              printf 'OCI tag %s already exists; refusing to overwrite it\n' "$image_ref" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|name unknown|not found' "$inspect_error"; then
              cat "$inspect_error" >&2
              rm -f "$inspect_error"
              printf 'Could not prove that OCI tag %s is unused\n' "$image_ref" >&2
              exit 1
            fi
            rm -f "$inspect_error"
          done
      - name: Build and publish immutable OCI image
        id: publish-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.commit }}
          build-args: |
            VERSION=${{ needs.build.outputs.tag }}
            COMMIT=${{ needs.build.outputs.commit }}
            BUILD_TIME=${{ needs.build.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.build.outputs.commit }}
          provenance: false
      - name: Attest release subjects
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ${{ runner.temp }}/asteria-release/checksums.txt
          show-summary: true
      - name: Attest OCI image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          push-to-registry: true
          show-summary: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_DIR: ${{ runner.temp }}/asteria-release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$RELEASE_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Asteria Drive $RELEASE_TAG" \
            --generate-notes
          immutable="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')"
          if [[ "$immutable" != 'true' ]]; then
            printf 'Published GitHub Release %s is not immutable\n' "$RELEASE_TAG" >&2
            exit 1
          fi

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Signed download URLs are bearer credentials. A console page must never send one to
  # another host through the Referer header, and a popup navigated to object storage
  # must not send the console URL back to the storage host either.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # No Content-Security-Policy here on purpose: uploads and downloads go directly to the
  # S3 public endpoint, whose origin is runtime configuration. A static `connect-src
  # 'self'` would break the data plane. Add a CSP only together with the deployment that
  # injects the storage origin, and verify upload/download/range in a real browser.

  location = /healthz {
    proxy_pass http://api:8080/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /readyz {
    proxy_pass http://api:8080/readyz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

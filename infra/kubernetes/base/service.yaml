apiVersion: v1
kind: Service
metadata:
  name: asteria-drive
  labels:
    app.kubernetes.io/name: asteria-drive
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asteria-drive
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
